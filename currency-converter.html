<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#E4405F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Курс">
<title>Курс — конвертер валют</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💱</text></svg>">
<!--FONTS-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<!--/FONTS-->
<style>
  :root {
    --bg: #EEF1F6;
    --surface: #FFFFFF;
    --text: #161922;
    --muted: #6B7185;
    --line: rgba(22, 25, 34, .08);
    --key-line: rgba(22, 25, 34, .13);
    --key-bg: rgba(255, 255, 255, .55);
    --accent: #E4405F;
    --page: #EADDE5;
    --ok: #1F9D6A;
    --warn: #E39B12;
    --up: #1F9D6A;
    --down: #E4405F;
    --num: "Unbounded", "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ui: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13151B; --surface: #1D2028; --text: #F2F3F7; --muted: #8B90A0;
      --line: rgba(255,255,255,.08); --key-line: rgba(255,255,255,.14); --key-bg: rgba(29,32,40,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #13151B; --surface: #1D2028; --text: #F2F3F7; --muted: #8B90A0;
    --line: rgba(255,255,255,.08); --key-line: rgba(255,255,255,.14); --key-bg: rgba(29,32,40,.55);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--page); }
  html, body { margin: 0; }
  body {
    height: 100%;
    background: var(--page);
    color: var(--text);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    overscroll-behavior: none;
  }
  html:not(.lite) body { transition: background-color .45s ease; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .app {
    height: 100%;
    max-width: 460px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 10px 16px 12px;
    gap: 14px;
  }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; min-height: 40px; contain: layout style; }
  .brand { font-family: var(--num); font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
  .top-right { display: flex; align-items: center; gap: 8px; }
  .theme-btn {
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); color: var(--text); box-shadow: 0 1px 0 var(--line);
    transition: transform .15s;
  }
  .theme-btn:active { transform: scale(.9); }
  .theme-btn svg { width: 20px; height: 20px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 999px;
    background: var(--surface); font-size: 13px; font-weight: 600; color: var(--muted);
    box-shadow: 0 1px 0 var(--line); white-space: nowrap; min-width: 0; max-width: 62vw;
  }
  #statusText { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); position: relative; flex: none; }
  .dot::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit;
    animation: ping 2.4s ease-out 3;
  }
  .lite .dot::after { display: none; }
  .status.offline .dot { background: var(--warn); }
  .status.offline .dot::after { animation: none; }
  .status.loading .dot { background: transparent; border: 2px solid var(--muted); border-top-color: transparent; animation: spin .7s linear infinite; }
  .status.loading .dot::after { display: none; }
  @keyframes ping { 0% { transform: scale(1); opacity: .6; } 80%, 100% { transform: scale(2.8); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 10;
    transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
    padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    background: var(--text); color: var(--bg);
    transition: opacity .25s, transform .35s cubic-bezier(.2,1.3,.4,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* Смена темы: новый снимок экрана проявляется поверх старого — только opacity, это делает видеокарта */
  ::view-transition-old(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-new(root) { animation: vt-in var(--vt-dur, .3s) cubic-bezier(.3,0,.2,1) both; mix-blend-mode: normal; }
  @keyframes vt-in { from { opacity: 0; } }
  /* На время смены темы отключаем все CSS-переходы цвета, чтобы экран не перерисовывался в каждом кадре */
  .no-trans, .no-trans *, .no-trans *::before, .no-trans *::after { transition: none !important; }
  .theme-pulse {
    position: fixed; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
    border: 2px solid var(--text); pointer-events: none; z-index: 20; opacity: 0;
    will-change: transform, opacity;
  }

  /* Hero */
  .hero {
    position: relative; overflow: hidden; flex: none;
    border-radius: 32px; padding: 18px 20px 20px;
    background: var(--accent); color: #fff;
    contain: layout paint style;
    box-shadow: 0 14px 28px -18px var(--accent);
  }
  .lite .hero { box-shadow: none; }
  .hero-fade {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.22), transparent 55%), var(--old, transparent);
  }
  .hero-shine {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.22), transparent 55%);
  }
  .watermark {
    position: absolute; right: -14px; bottom: -46px;
    font-family: var(--num); font-weight: 600; font-size: 190px; line-height: 1;
    color: rgba(255,255,255,.12); pointer-events: none;
  }
  .chip { position: relative; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .chip .code { opacity: .7; font-weight: 500; }
  .hero-body { position: relative; }
  .amount {
    margin-top: 18px;
    font-family: var(--num); font-weight: 500; font-size: 60px; line-height: 1.05;
    letter-spacing: -.03em; white-space: nowrap; overflow: hidden;
    height: 1.05em;
  }
  .amount .ph { opacity: .45; }
  .amount .cur { opacity: .55; margin-left: .18em; font-weight: 400; }
  .amount .new { display: inline-block; animation: pop .28s cubic-bezier(.2,1.4,.4,1); }
  .caret {
    display: inline-block; width: 3px; height: .8em; margin-left: 4px; vertical-align: -.02em;
    background: rgba(255,255,255,.8); border-radius: 2px; animation: blink 1.1s steps(1) infinite;
  }
  @keyframes pop { from { transform: translateY(45%) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }

  /* Rows */
  .list { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .row {
    display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px;
    width: 100%; text-align: left; padding: 10px 6px; border-radius: 20px;
    contain: layout style;
  }
  .row:active { background: var(--line); }
  .row[hidden] { display: none; }
  .disc {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: var(--c); color: #fff; font-family: var(--num); font-weight: 600; font-size: 18px;
  }
  .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rate { font-size: 12.5px; color: var(--muted); font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .delta { font-style: normal; font-weight: 700; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .val {
    font-family: var(--num); font-weight: 500; font-size: 21px; letter-spacing: -.02em;
    white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; text-align: right;
  }
  .val.flash { color: var(--c); }
  html:not(.lite) .val { transition: color .9s ease; }

  /* Keypad */
  .pad { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; contain: layout style; }
  .key {
    position: relative;
    height: clamp(50px, 7.4vh, 64px); border-radius: 20px;
    font-family: var(--num); font-size: 24px; font-weight: 400;
    display: grid; place-items: center;
    background: var(--key-bg);
    border: 1.5px solid var(--key-line);
    transition: transform .2s cubic-bezier(.2,1.5,.4,1), border-color .15s, color .15s;
    touch-action: manipulation;
  }
  .key > * { position: relative; }
  .key .fx {
    position: absolute; inset: -1.5px; border-radius: inherit; pointer-events: none;
    background: var(--accent); opacity: 0;
  }
  .key.pressed {
    transform: scale(.9);
    border-color: var(--accent);
    color: var(--accent);
    transition-duration: .07s;
  }
  .key.pressed .fx { opacity: .14; }
  .key svg { width: 26px; height: 26px; }
  .key.del.holding .fx { opacity: .3; transition: opacity .55s linear; }

  @media (max-height: 640px) {
    .amount { font-size: 48px; margin-top: 12px; }
    .hero { padding: 14px 18px 16px; }
    .row { padding: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Курс</div>
    <div class="top-right">
      <button class="status loading" id="status" aria-live="polite" title="Обновить курс">
        <span class="dot"></span><span id="statusText">Загружаю курс</span>
      </button>
      <button class="theme-btn" id="themeBtn" aria-label="Тема оформления"></button>
    </div>
  </header>

  <section class="hero" id="hero" aria-label="Сумма для пересчёта">
    <div class="hero-shine"></div>
    <div class="hero-fade" id="heroFade"></div>
    <div class="watermark" id="wm">₽</div>
    <div class="hero-body" id="heroBody">
      <div class="chip"><span id="heroName">Российский рубль</span><span class="code" id="heroCode">RUB</span></div>
      <div class="amount" id="amount"></div>
    </div>
  </section>

  <div class="list" id="list"></div>

  <div class="pad" id="pad">
    <button class="key" data-k="1"><i class="fx"></i><span>1</span></button>
    <button class="key" data-k="2"><i class="fx"></i><span>2</span></button>
    <button class="key" data-k="3"><i class="fx"></i><span>3</span></button>
    <button class="key" data-k="4"><i class="fx"></i><span>4</span></button>
    <button class="key" data-k="5"><i class="fx"></i><span>5</span></button>
    <button class="key" data-k="6"><i class="fx"></i><span>6</span></button>
    <button class="key" data-k="7"><i class="fx"></i><span>7</span></button>
    <button class="key" data-k="8"><i class="fx"></i><span>8</span></button>
    <button class="key" data-k="9"><i class="fx"></i><span>9</span></button>
    <button class="key" data-k=","><i class="fx"></i><span>,</span></button>
    <button class="key" data-k="0"><i class="fx"></i><span>0</span></button>
    <button class="key del" data-k="del" aria-label="Стереть. Удерживайте, чтобы очистить"><i class="fx"></i>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="m12.5 9.5 5 5m0-5-5 5"/></svg>
    </button>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(() => {
  "use strict";
  const CUR = {
    RUB: { name: "Российский рубль", sym: "₽", color: "#E4405F" },
    USD: { name: "Доллар США",       sym: "$", color: "#1F9D6A" },
    EUR: { name: "Евро",             sym: "€", color: "#3B5BDB" },
    KZT: { name: "Казахстанский тенге", sym: "₸", color: "#0AA5C9" }
  };
  const ORDER = ["RUB", "USD", "EUR", "KZT"];
  const REFRESH_MS = 60 * 1000;
  const root = document.documentElement;
  const bridge = window.AndroidBridge;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Облегчённый режим для слабых устройств: меньше тяжёлых эффектов, анимации нажатий остаются
  let lite = false;
  try {
    if (bridge && bridge.isLowEnd) lite = !!bridge.isLowEnd();
    else lite = (navigator.deviceMemory && navigator.deviceMemory <= 3) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
  } catch (e) {}
  if (lite) root.classList.add("lite");
  const anim = !reduced;

  // Встроенный курс на случай, если сети нет при первом запуске (ЦБ РФ и НБ РК, 1 октября 2026)
  let rates = { USD: 1, RUB: 83.56, EUR: 0.8807, KZT: 440.86 };
  let ratesTime = Date.parse("2026-10-01T00:00:00+03:00");
  let lastCheck = 0;
  let online = false;
  let active = "RUB";
  let input = "1000";

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const saved = store.get("fx-rates");
  if (saved && saved.rates && saved.time) { rates = saved.rates; ratesTime = saved.time; }
  const st = store.get("fx-state");
  if (st && CUR[st.active]) { active = st.active; input = typeof st.input === "string" ? st.input : input; }

  const $ = id => document.getElementById(id);
  const amountEl = $("amount"), listEl = $("list"), hero = $("hero");

  // ---------- Formatting (форматтеры создаются один раз) ----------
  const fmt2 = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt0 = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
  const fmt4 = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  const fmtMoney = n => !isFinite(n) ? "0" : (Math.abs(n) >= 1e6 ? fmt0.format(n) : fmt2.format(n));
  const groupInt = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, "\u202F");
  const amountValue = () => parseFloat((input || "0").replace(",", ".")) || 0;
  const convert = (v, from, to) => v / rates[from] * rates[to];
  const setText = (el, t) => { if (el.textContent !== t) el.textContent = t; };

  // ---------- Rows ----------
  const rows = {};
  const frag = document.createDocumentFragment();
  ORDER.forEach(code => {
    const c = CUR[code];
    const b = document.createElement("button");
    b.className = "row";
    b.style.setProperty("--c", c.color);
    b.dataset.code = code;
    b.innerHTML = `<span class="disc">${c.sym}</span>
      <span class="meta"><span class="name">${c.name}</span><span class="rate"><span class="rt"></span><i class="delta"></i></span></span>
      <span class="val">0</span>`;
    frag.appendChild(b);
    rows[code] = { el: b, val: b.querySelector(".val"), rt: b.querySelector(".rt"), delta: b.querySelector(".delta"), shown: 0, from: 0, to: 0 };
  });
  listEl.appendChild(frag);
  listEl.addEventListener("click", e => {
    const b = e.target.closest(".row");
    if (b) switchTo(b.dataset.code);
  });

  function rateLine(code) {
    let mult = 1;
    const y = convert(1, code, active);
    while (y * mult < 1 && mult < 1e6) mult *= 10;
    const n = y * mult;
    return `${fmt0.format(mult)} ${CUR[code].sym} = ${n >= 100 ? fmt2.format(n) : fmt4.format(n)} ${CUR[active].sym}`;
  }

  // ---------- Один общий цикл анимации чисел ----------
  let tweenRaf = 0, tweenStart = 0, tweenDur = 0;
  function tweenFrame(now) {
    const p = Math.min(1, (now - tweenStart) / tweenDur);
    const e = 1 - Math.pow(1 - p, 3);
    for (const code of ORDER) {
      const r = rows[code];
      if (code === active || r.from === r.to) continue;
      r.shown = r.from + (r.to - r.from) * e;
      r.val.textContent = fmtMoney(r.shown);
    }
    tweenRaf = p < 1 ? requestAnimationFrame(tweenFrame) : 0;
  }
  // ms = 0: мгновенно (ввод с клавиатуры), иначе плавно
  function renderRows(ms, withRates) {
    const v = amountValue();
    cancelAnimationFrame(tweenRaf); tweenRaf = 0;
    const smooth = anim && ms > 0;
    for (const code of ORDER) {
      const r = rows[code];
      const isActive = code === active;
      if (r.el.hidden !== isActive) r.el.hidden = isActive;
      if (isActive) continue;
      if (withRates) setText(r.rt, rateLine(code));
      const target = convert(v, active, code);
      if (smooth) { r.from = r.shown; r.to = target; }
      else { r.shown = r.from = r.to = target; setText(r.val, fmtMoney(target)); }
    }
    if (smooth) { tweenStart = performance.now(); tweenDur = ms; tweenRaf = requestAnimationFrame(tweenFrame); }
  }

  // ---------- Hero amount ----------
  let fitFor = "";
  function renderAmount(popLast) {
    let html;
    if (!input) {
      html = `<span class="ph">0</span>`;
    } else {
      const i = input.split(",")[0];
      const d = input.includes(",") ? "," + input.split(",")[1] : "";
      const full = groupInt(i) + d;
      // анимируется только последний введённый символ, остальное — обычный текст
      html = popLast && anim
        ? full.slice(0, -1) + `<span class="new">${full.slice(-1)}</span>`
        : full;
    }
    amountEl.innerHTML = html + `<span class="caret"></span><span class="cur">${CUR[active].sym}</span>`;
    fitAmount();
  }
  // Одно измерение вместо цикла с многократным пересчётом раскладки
  function fitAmount() {
    const base = innerHeight < 640 ? 48 : 60;
    amountEl.style.fontSize = base + "px";
    const sw = amountEl.scrollWidth, cw = amountEl.clientWidth;
    if (sw > cw && cw > 0) amountEl.style.fontSize = Math.max(22, Math.floor(base * cw / sw) - 1) + "px";
  }

  function paintTheme() {
    const c = CUR[active];
    root.style.setProperty("--accent", c.color);
    root.style.setProperty("--page", mix(c.color, getBg(), .09));
    document.querySelector('meta[name="theme-color"]').setAttribute("content", c.color);
    setText($("heroName"), c.name);
    setText($("heroCode"), active);
    setText($("wm"), c.sym);
    try { bridge && bridge.setThemeColor(c.color); } catch (e) {}
  }
  // Цвет фона считается в JS один раз, а не через color-mix при каждой перерисовке
  const getBg = () => isDark() ? "#13151B" : "#EEF1F6";
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = s => Math.round(((pa >> s) & 255) * t + ((pb >> s) & 255) * (1 - t));
    return "#" + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
  }

  let saveTimer;
  function saveState() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => store.set("fx-state", { active, input }), 400);
  }

  // ---------- Switching currency ----------
  const EASE = "cubic-bezier(.2,.8,.2,1)";
  function switchTo(code) {
    if (code === active) return;
    buzz();
    const v = convert(amountValue(), active, code);
    const prev = active;
    const oldColor = CUR[prev].color;
    input = v > 0 ? trimNum(v) : "";

    const first = {};
    if (anim && !lite) ORDER.forEach(k => { if (!rows[k].el.hidden) first[k] = rows[k].el.getBoundingClientRect().top; });

    active = code;
    paintTheme();
    rows[prev].shown = v ? convert(v, code, prev) : 0;
    renderAmount(false);
    renderRows(0, true);
    saveState();

    if (!anim) return;
    // Плавная смена цвета карточки: затухает слой со старым цветом (только opacity — дёшево для GPU)
    const fade = $("heroFade");
    fade.style.setProperty("--old", oldColor);
    fade.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, easing: "ease-out" });
    $("heroBody").animate([{ transform: "translateY(22px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 380, easing: EASE });
    rows[prev].el.animate([{ transform: "translateY(-24px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 420, easing: EASE });
    if (lite) return;
    $("wm").animate([{ transform: "translateY(40px) rotate(-14deg) scale(.8)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 600, easing: "cubic-bezier(.2,1.2,.3,1)" });
    ORDER.forEach(k => {
      if (k === code || k === prev || first[k] === undefined) return;
      const dy = first[k] - rows[k].el.getBoundingClientRect().top;
      if (dy) rows[k].el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 400, easing: EASE });
    });
  }
  function trimNum(v) {
    return (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, "").replace(".", ",");
  }

  // ---------- Keypad (один обработчик на всю клавиатуру) ----------
  function press(k) {
    let popped = false;
    if (k === "del") {
      if (!input) return;
      input = input.slice(0, -1);
    } else if (k === ",") {
      if (input.includes(",")) return shake();
      input = (input || "0") + ",";
      popped = true;
    } else {
      const parts = input.split(",");
      if (parts[1] !== undefined && parts[1].length >= 2) return shake();
      if (parts[1] === undefined && parts[0].replace(/^0+/, "").length >= 12) return shake();
      if (input === "0") input = "";
      input += k;
      popped = true;
    }
    renderAmount(popped);
    renderRows(0, false);
    saveState();
  }
  function clearAll() {
    if (!input) return;
    buzz(20);
    const done = () => { input = ""; renderAmount(false); renderRows(anim ? 300 : 0, false); saveState(); };
    if (!anim) return done();
    amountEl.animate([{ transform: "none", opacity: 1 }, { transform: "translateY(-20%) scale(.9)", opacity: 0 }], { duration: 200, easing: "ease-in" }).onfinish = done;
  }
  function shake() {
    buzz(30);
    if (anim) amountEl.animate([
      { transform: "translateX(0)" }, { transform: "translateX(-8px)" }, { transform: "translateX(7px)" },
      { transform: "translateX(-4px)" }, { transform: "translateX(0)" }
    ], { duration: 300 });
  }
  function buzz(ms = 8) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

  const pad = $("pad");
  let pressedKey = null, holdTimer = null, held = false;
  function release(btn, commit) {
    clearTimeout(holdTimer);
    btn.classList.remove("pressed", "holding");
    if (anim) btn.animate([{ transform: "scale(.9)" }, { transform: "scale(1.05)" }, { transform: "scale(1)" }], { duration: 300, easing: EASE });
    if (commit && btn.dataset.k === "del" && !held) press("del");
    pressedKey = null;
  }
  pad.addEventListener("pointerdown", e => {
    const btn = e.target.closest(".key");
    if (!btn) return;
    if (pressedKey && pressedKey !== btn) release(pressedKey, false);
    pressedKey = btn;
    btn.classList.add("pressed");
    buzz();
    const k = btn.dataset.k;
    if (k === "del") {
      held = false;
      btn.classList.add("holding");
      holdTimer = setTimeout(() => { held = true; btn.classList.remove("holding"); clearAll(); }, 550);
    } else {
      press(k); // цифры срабатывают сразу при касании — ввод ощущается мгновенным
    }
  });
  pad.addEventListener("pointerup", () => { if (pressedKey) release(pressedKey, true); });
  pad.addEventListener("pointercancel", () => { if (pressedKey) release(pressedKey, false); });
  pad.addEventListener("pointerleave", () => { if (pressedKey) release(pressedKey, false); });
  pad.addEventListener("click", e => {
    // клик без указателя (клавиатура, спецвозможности)
    if (e.detail !== 0) return;
    const btn = e.target.closest(".key");
    if (btn) press(btn.dataset.k);
  });
  document.addEventListener("keydown", e => {
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "," || e.key === ".") press(",");
    else if (e.key === "Backspace") press("del");
    else if (e.key === "Escape") clearAll();
  });

  // ---------- Live rates ----------
  const SOURCES = [
    {
      url: "https://open.er-api.com/v6/latest/USD",
      parse: j => j && j.result === "success" && j.rates
        ? { rates: { USD: 1, RUB: j.rates.RUB, EUR: j.rates.EUR, KZT: j.rates.KZT }, time: j.time_last_update_unix * 1000 } : null
    },
    {
      url: "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json",
      parse: j => j && j.usd
        ? { rates: { USD: 1, RUB: j.usd.rub, EUR: j.usd.eur, KZT: j.usd.kzt }, time: Date.parse(j.date + "T00:00:00Z") } : null
    },
    {
      url: "https://latest.currency-api.pages.dev/v1/currencies/usd.json",
      parse: j => j && j.usd
        ? { rates: { USD: 1, RUB: j.usd.rub, EUR: j.usd.eur, KZT: j.usd.kzt }, time: Date.parse(j.date + "T00:00:00Z") } : null
    }
  ];
  const valid = r => r && ["RUB", "EUR", "KZT"].every(k => typeof r.rates[k] === "number" && r.rates[k] > 0);

  async function fetchOne(src) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    try {
      const res = await fetch(src.url + "?t=" + Date.now(), { signal: ctrl.signal, cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const r = src.parse(await res.json());
      if (!valid(r)) throw new Error("bad data");
      return r;
    } finally { clearTimeout(t); }
  }

  // Источники опрашиваются по очереди: следующий — только если предыдущий не ответил
  let loading = false, refreshTimer = 0;
  async function refresh() {
    if (loading) return;
    loading = true;
    clearTimeout(refreshTimer);
    setStatus("loading");
    let got = null;
    for (const src of SOURCES) {
      try { got = await fetchOne(src); break; } catch (e) {}
    }
    loading = false;
    lastCheck = Date.now();
    online = !!got;
    if (got) applyRates(got);
    setStatus();
    if (document.visibilityState === "visible") refreshTimer = setTimeout(refresh, REFRESH_MS);
  }

  function applyRates(r) {
    const before = {};
    ORDER.forEach(k => { before[k] = convert(1, k, active); });
    const changed = ORDER.some(k => Math.abs(rates[k] - r.rates[k]) / r.rates[k] > 1e-6);
    rates = r.rates; ratesTime = r.time || Date.now();
    if (!changed) return;
    store.set("fx-rates", { rates, time: ratesTime });
    renderRows(900, true);
    ORDER.forEach(k => {
      if (k === active) return;
      const now = convert(1, k, active);
      const diff = now - before[k];
      if (Math.abs(diff) / now < 1e-6) return;
      const row = rows[k];
      row.delta.className = "delta " + (diff > 0 ? "up" : "down");
      row.delta.textContent = (diff > 0 ? "▲ " : "▼ ") + Math.abs(diff / before[k] * 100).toFixed(2) + "%";
      row.val.classList.add("flash");
      setTimeout(() => row.val.classList.remove("flash"), 400);
      setTimeout(() => { row.delta.textContent = ""; }, 6000);
    });
  }

  const timeFmt = new Intl.DateTimeFormat("ru-RU", { hour: "2-digit", minute: "2-digit" });
  const dayFmt = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "short" });
  let statusState = "";
  function setStatus(state) {
    const el = $("status");
    const next = state === "loading" ? "loading" : (online ? "" : "offline");
    if (next !== statusState) {
      el.classList.remove("loading", "offline");
      if (next) el.classList.add(next);
      statusState = next;
    }
    let text;
    if (state === "loading") text = "Обновляю курс";
    else if (online) text = Date.now() - lastCheck < 60000 ? "Курс актуален" : "Проверено в " + timeFmt.format(lastCheck);
    else text = "Офлайн, курс от " + dayFmt.format(ratesTime);
    setText($("statusText"), text);
  }

  $("status").addEventListener("click", () => { buzz(); refresh(); });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") { clearTimeout(refreshTimer); return; }
    if (Date.now() - lastCheck > 20000) refresh();
    else refreshTimer = setTimeout(refresh, REFRESH_MS - (Date.now() - lastCheck));
  });
  addEventListener("online", refresh);
  let resizeRaf = 0;
  addEventListener("resize", () => { cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(fitAmount); });
  setInterval(() => { if (!loading && document.visibilityState === "visible") setStatus(); }, 30000);

  // ---------- Theme ----------
  const THEMES = ["auto", "light", "dark"];
  const THEME_LABEL = { auto: "Тема как в системе", light: "Светлая тема", dark: "Тёмная тема" };
  const THEME_ICON = {
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"/></svg>'
  };
  const mq = matchMedia("(prefers-color-scheme: dark)");
  let themeMode = THEMES.includes(store.get("fx-theme")) ? store.get("fx-theme") : "auto";
  let systemDark = mq.matches;
  try { if (bridge && bridge.isSystemDark) systemDark = !!bridge.isSystemDark(); } catch (e) {}
  function isDark() { return themeMode === "dark" || (themeMode === "auto" && systemDark); }

  function applyTheme() {
    const dark = isDark();
    root.setAttribute("data-theme", dark ? "dark" : "light");
    root.style.colorScheme = dark ? "dark" : "light";
    root.style.setProperty("--page", mix(CUR[active].color, getBg(), .09));
    $("themeBtn").innerHTML = THEME_ICON[themeMode];
    $("themeBtn").setAttribute("aria-label", THEME_LABEL[themeMode] + ". Нажмите, чтобы сменить");
    try { bridge && bridge.setThemeMode && bridge.setThemeMode(themeMode); } catch (e) {}
  }
  let toastTimer;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
  }
  let pulseEl = null, themeBusy = null;
  function pulseFrom(el) {
    // Небольшое кольцо расходится от кнопки: маленький элемент, анимируются только transform и opacity
    const r = el.getBoundingClientRect();
    if (!pulseEl) { pulseEl = document.createElement("div"); pulseEl.className = "theme-pulse"; document.body.appendChild(pulseEl); }
    pulseEl.style.left = (r.left + r.width / 2) + "px";
    pulseEl.style.top = (r.top + r.height / 2) + "px";
    pulseEl.animate(
      [{ transform: "scale(1)", opacity: .5 }, { transform: "scale(6)", opacity: 0 }],
      { duration: lite ? 380 : 480, easing: "cubic-bezier(.2,.7,.3,1)" });
  }
  function setThemeAnimated(fromEl, change) {
    const wasDark = isDark();
    change();
    if (wasDark === isDark()) { applyTheme(); return; }
    root.classList.add("no-trans");
    const done = () => requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("no-trans")));
    if (anim) pulseFrom(fromEl);
    if (!anim || !document.startViewTransition) { applyTheme(); done(); return; }
    if (themeBusy) { try { themeBusy.skipTransition(); } catch (e) {} }
    root.style.setProperty("--vt-dur", lite ? ".22s" : ".32s");
    const vt = document.startViewTransition(applyTheme);
    themeBusy = vt;
    vt.finished.catch(() => {}).then(() => { if (themeBusy === vt) themeBusy = null; done(); });
  }
  $("themeBtn").addEventListener("click", e => {
    buzz();
    setThemeAnimated(e.currentTarget, () => {
      themeMode = THEMES[(THEMES.indexOf(themeMode) + 1) % THEMES.length];
      store.set("fx-theme", themeMode);
    });
    if (anim) $("themeBtn").firstElementChild.animate(
      [{ transform: "rotate(-120deg) scale(.4)", opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 420, easing: "cubic-bezier(.2,1.3,.4,1)" });
    toast(THEME_LABEL[themeMode]);
  });
  window.__systemDark = dark => {
    if (dark === systemDark) return;
    if (themeMode !== "auto") { systemDark = dark; return; }
    setThemeAnimated($("themeBtn"), () => { systemDark = dark; });
  };
  if (mq.addEventListener) mq.addEventListener("change", e => { if (!bridge) window.__systemDark(e.matches); });

  // ---------- Start ----------
  applyTheme();
  paintTheme();
  renderAmount(false);
  renderRows(0, true);
  setStatus("loading");
  if (document.fonts) document.fonts.ready.then(fitAmount);

  if (anim) {
    hero.animate([{ transform: "translateY(16px) scale(.97)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 550, easing: EASE });
    if (!lite) ORDER.filter(k => k !== active).forEach((k, i) => {
      rows[k].el.animate([{ transform: "translateY(14px)", opacity: 0 }, { transform: "none", opacity: 1 }],
        { duration: 450, delay: 100 + i * 60, easing: EASE, fill: "backwards" });
    });
  }
  // Курс запрашивается после первой отрисовки, чтобы не тормозить запуск
  requestAnimationFrame(() => setTimeout(refresh, 0));
})();
</script>
</body>
</html>
